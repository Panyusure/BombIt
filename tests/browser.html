<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>BombIt browser tests</title>
<style>
  body{margin:0;background:#111;color:#ddd;font:13px/1.6 Consolas,monospace}
  #out{white-space:pre-wrap;padding:8px}
  #stage{position:fixed;left:-9999px;top:0}
</style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>
  <pre id="out">running…</pre>

<script>
  // 固定帧由测试显式推进，避免素材加载或机器帧率影响断言。
  window.__frameQueue = [];
  window.requestAnimationFrame = function (callback) { window.__frameQueue.push(callback); return window.__frameQueue.length; };
  window.__errs = [];
  window.addEventListener('error', function (e) {
    window.__errs.push((e.message || e.type) + ' @' + (e.filename || '?') + ':' + (e.lineno || '?'));
  });
</script>

<script src="../assets/characters.js"></script>
<script src="../src/core/config.js"></script>
<script src="../src/core/rng.js"></script>
<script src="../src/core/input.js"></script>
<script src="../src/game/grid.js"></script>
<script src="../src/game/levelgen.js"></script>
<script src="../src/game/motion.js"></script>
<script src="../src/game/rules.js"></script>
<script src="../src/game/danger.js"></script>
<script src="../src/game/entities.js"></script>
<script src="../src/game/ai.js"></script>
<script src="../src/game/match.js"></script>
  <script src="../src/game/engine.js"></script>
  <script src="../src/game/snapshot.js"></script>
  <script src="../src/game/observation.js"></script>
<script src="../src/render/draw.js"></script>
<script src="../src/render/assets.js"></script>
<script src="../src/render/effects.js"></script>
<script src="../src/render/sprites.js"></script>
<script src="../src/render/hud.js"></script>
<script src="../src/audio/sfx.js"></script>
<script src="../src/audio/music.js"></script>
<script src="../src/scenes/menu.js"></script>
<script src="../src/scenes/pause.js"></script>
<script src="../src/scenes/result.js"></script>
<script src="../src/main.js"></script>

<script>
/* ============================================================
 * 浏览器端测试：只测 Node 测不到的东西 ——
 *   DOM/Canvas 接线、真实键盘事件、按模式切换的键位表、
 *   场景状态机、菜单导航、鼠标点击、音频解锁、渲染不抛异常
 * 用 --dump-dom 把结果抓回终端
 * ============================================================ */
window.addEventListener('load', async function () {
  var lines = [], pass = 0, fail = 0;

  function ok(cond, label, detail) {
    if (cond) { pass++; lines.push('PASS  ' + label); }
    else { fail++; lines.push('FAIL  ' + label + (detail ? '  →  ' + detail : '')); }
  }
  function group(t) { lines.push(''); lines.push('── ' + t + ' ──'); }

  var BI = window.BI, D = BI.debug, CFG = BI.config, G = BI.grid;

  function key(type, code) {
    window.dispatchEvent(new KeyboardEvent(type, { code: code, bubbles: true }));
  }
  function bricks() { return BI.match.countBricks(D.world.map); }
  function bombOwners() {
    return D.world.bombs.map(function (b) { return b.ownerId; }).sort().join(',');
  }
  function click(x, y) {
    BI.mouse.x = x; BI.mouse.y = y; BI.mouse.inside = true; BI.mouse.clicked = true;
  }
  function unclick() { BI.mouse.inside = false; BI.mouse.clicked = false; }

  try {
    /* ---------- 0. 音乐：加载完就尝试播放（不等用户交互） ---------- */
    // 这一段必须放在最前面：后面所有测试都会发键盘事件，
    // 那是"用户交互"，会把这里要验的「未交互时的行为」冲掉。
    group('0. 音乐：刷新即尝试播放，而不是等点击');
    ok(!!BI.music && BI.music.failed === false, 'music.js 已装载且浏览器支持 Audio',
       BI.music ? BI.music.status() : 'missing');
    ok(BI.music.id === 'menu', 'boot() 就把新的 AI 菜单曲点好了', String(BI.music.id));
    ok((BI.music.el && BI.music.el.paused === false) || BI.music.blocked === true || BI.music.ready === true,
       '加载后立刻调了 play()：要么在播，要么被浏览器策略拦下', BI.music.status());
    ok(BI.music.el.loop === true, '菜单曲是循环播放的');
    ok(typeof BI.music.waiting() === 'boolean',
       'waiting() 供 main.js 判断还要不要继续监听交互补播');

    /* ---------- 1. 键位表：按模式绑定，绝不写死 ---------- */
    group('1. 键位表（同一玩家在不同模式下放弹键不同）');
    var kSolo = BI.input.map('solo', false);
    var kVersus = BI.input.map('versus', false);
    var kAlt = BI.input.map('solo', true);

    ok(kSolo.p1.bomb === 'Space', '单人：1P 放弹 = 空格', kSolo.p1.bomb);
    ok(BI.input.codes(kSolo.p1.up).indexOf('ArrowUp') >= 0 &&
       BI.input.codes(kSolo.p1.left).indexOf('ArrowLeft') >= 0, '单人：1P 用方向键移动');
    ok(BI.input.codes(kSolo.p1.up).indexOf('KeyW') >= 0 &&
       BI.input.codes(kSolo.p1.down).indexOf('KeyS') >= 0 &&
       BI.input.codes(kSolo.p1.left).indexOf('KeyA') >= 0 &&
       BI.input.codes(kSolo.p1.right).indexOf('KeyD') >= 0, '单人：1P 也可以用 WASD 移动');
    ok(kVersus.p1.bomb === 'Enter', '双人：1P 放弹 = Enter（不是空格）', kVersus.p1.bomb);
    ok(kVersus.p2.bomb === 'Space', '双人：2P 放弹 = 空格', kVersus.p2.bomb);
    ok(kVersus.p2.up === 'KeyW' && kVersus.p2.left === 'KeyA' &&
       kVersus.p2.down === 'KeyS' && kVersus.p2.right === 'KeyD', '双人：2P 用 WASD 移动');
    ok(kVersus.p1.up === 'ArrowUp' && BI.input.codes(kVersus.p1.up).indexOf('KeyW') < 0,
       '双人：1P 不绑 WASD（WASD 是 2P 的，不能串台）');
    ok(kVersus.p2.bomb !== kVersus.p1.bomb, '双人：两个玩家的放弹键不冲突');
    ok(BI.input.codes(kAlt.p1.up).indexOf('KeyI') >= 0 && kAlt.p1.bomb === 'KeyU',
       '备用键位（键盘无冲兜底）可切换');

    /* ---------- 2. 场景状态机 ---------- */
    group('2. 场景状态机 menu -> playing -> result');
    ok(D.scene === 'menu', '启动后停在开始界面', D.scene);
    D.quickStart('dig', 'SCN01');
    ok(D.scene === 'playing', '开局后进入对局', D.scene);
    ok(D.world.mode === 'dig', '对局模式是计时拆砖', D.world.mode);
    ok(D.world.match.remaining > 0, '倒计时已启动', String(D.world.match.remaining));

    /* ---------- 3. 单人模式键盘实测 ---------- */
    group('3. 单人模式：空格放弹 / Enter 不该放弹');
    D.quickStart('dig', 'SOLO01');
    D.tick(0.2);
    D.press('Space');
    ok(D.world.bombs.length === 1, '单人按【空格】放下了炸弹', 'bombs=' + D.world.bombs.length);
    ok(bombOwners() === 'p1', '炸弹归属 1P', bombOwners());

    D.quickStart('dig', 'SOLO02');
    D.tick(0.2);
    D.press('Enter');
    ok(D.world.bombs.length === 0, '单人按【Enter】不会放炸弹（键位不串台）',
       'bombs=' + D.world.bombs.length);
    D.press('Space');
    ok(D.world.bombs.length === 1, '单人：Enter 之后按空格照样能放弹', 'bombs=' + D.world.bombs.length);

    /* ---------- 3b. 单人模式：WASD 与方向键并存 ---------- */
    group('3b. 单人模式：WASD 也能移动，且不抢放弹键');
    D.quickStart('dig', 'SOLO_WASD');
    D.tick(0.2);
    (function () {
      var w = D.world, p = w.players[0];
      // 清出一片空地，测的才是"能不能走"而不是"有没有路"
      for (var r = 1; r <= 8; r++) for (var c = 1; c <= 12; c++) G.set(w.map, c, r, BI.T.EMPTY);
      w.bombs = []; (w.enemies || []).forEach(function (e) { e.stun = 999; });
      p.x = p.px = G.centerX(4); p.y = p.py = G.centerY(4); p.axisPref = 'x';

      var x0 = p.x;
      D.hold('KeyD', 0.4);
      ok(p.x > x0 + 1, '单人按【D】向右走动', 'dx=' + (p.x - x0).toFixed(1));
      ok(w.bombs.length === 0, 'D 只负责移动，不会顺手放弹（放弹键仍是空格）', 'bombs=' + w.bombs.length);

      var y0 = p.y, x1 = p.x;
      D.hold('KeyW', 0.4);
      ok(p.y < y0 - 1, '单人按【W】向上走动', 'dy=' + (p.y - y0).toFixed(1));
      ok(Math.abs(p.x - x1) < 0.01, 'W 只沿 y 轴走，不是斜走', 'dx=' + (p.x - x1).toFixed(2));

      var y1 = p.y;
      D.hold('KeyS', 0.4);
      ok(p.y > y1 + 1, '单人按【S】向下走动', 'dy=' + (p.y - y1).toFixed(1));
      var x2 = p.x;
      D.hold('KeyA', 0.4);
      ok(p.x < x2 - 1, '单人按【A】向左走动', 'dx=' + (p.x - x2).toFixed(1));

      // 方向键没有被顶掉
      p.axisPref = 'x';
      var y2 = p.y, x3 = p.x;
      D.hold('ArrowRight', 0.4);
      ok(p.x > x3 + 1, '方向键依然能移动（两套键位并存）', 'dx=' + (p.x - x3).toFixed(1));
      p.axisPref = 'y';
      D.hold('ArrowUp', 0.4);
      ok(p.y < y2 - 1, '方向键上依然能移动', 'dy=' + (p.y - y2).toFixed(1));

      // 一个动作绑两个键：松开其中一个，另一个还按着就要继续走
      p.axisPref = 'x';
      key('keydown', 'ArrowRight'); key('keydown', 'KeyD');
      D.tick(0.2);
      key('keyup', 'KeyD');
      var x4 = p.x;
      D.tick(0.3);
      key('keyup', 'ArrowRight');
      ok(p.x > x4 + 1, '方向键和 D 同时按住时，松开 D 方向键立刻接管（不卡住）',
         'dx=' + (p.x - x4).toFixed(1));
      ok(!BI.input.isDown('KeyD') && !BI.input.isDown('ArrowRight'), '两个键都已松开，按键状态清干净');

      // 单人模式里 WASD 只有移动这一个身份，不能顺带放弹/施法
      var cd0 = p.skillCd || 0;
      D.press('KeyS');
      ok(w.bombs.length === 0 && (p.skillCd || 0) === cd0,
         '按 S 只负责移动，不会顺带放弹或施法', 'bombs=' + w.bombs.length + ' cd=' + (p.skillCd || 0));
    })();
    // HUD 键位提示必须把两套移动键都报出来，否则玩家按 WASD 走动了会以为串键
    (function () {
      var texts = [], realText = BI.draw.text;
      BI.draw.text = function (ctx, t) { texts.push(String(t)); return realText.apply(this, arguments); };
      try { D.render(1); } finally { BI.draw.text = realText; }
      ok(texts.some(function (t) { return t.indexOf('方向键') >= 0 && t.indexOf('WASD') >= 0; }),
         '单人 HUD 同时标出「方向键 / WASD」',
         texts.filter(function (t) { return t.indexOf('移动') >= 0; }).join(' | '));
    })();

    /* ---------- 4. 双人模式键盘实测 ---------- */
    group('4. 双人模式：1P=Enter，2P=空格');
    D.quickStart('versus', 'VERS01');
    D.tick(0.2);
    ok(D.world.players.length === 2, '双人模式创建了 2 个玩家');

    D.press('Enter');
    ok(D.world.bombs.length === 1 && bombOwners() === 'p1', '双人：按【Enter】= 1P 放弹',
       'bombs=' + bombOwners());
    D.press('Space');
    ok(D.world.bombs.length === 2 && bombOwners() === 'p1,p2',
       '双人：按【空格】= 2P 放弹（两颗各归各家）', 'bombs=' + bombOwners());

    D.quickStart('versus', 'VERS02');
    D.tick(0.2);
    var p1x0 = D.world.players[0].x, p2x0 = D.world.players[1].x;
    D.hold('ArrowRight', 0.4);
    var p1Moved = D.world.players[0].x - p1x0;
    var p2MovedAfter1P = D.world.players[1].x - p2x0;
    D.hold('KeyA', 0.4);
    var p2Moved = D.world.players[1].x - p2x0;
    ok(p1Moved > 0, '1P 按方向键右走动了', 'dx=' + p1Moved.toFixed(1));
    ok(Math.abs(p2MovedAfter1P) < 0.01, '1P 操作不会带着 2P 一起动', 'dx=' + p2MovedAfter1P.toFixed(2));
    ok(p2Moved < 0, '2P 按 A 键向左走动了', 'dx=' + p2Moved.toFixed(1));

    /* ---------- 5. 菜单导航 ---------- */
    group('5. 菜单：先选模式，再选角色');
    D.gotoMenu();
    var M0 = D.app.menu;
    ok(BI.menu.MODES.length === 3, '一共有三种模式', String(BI.menu.MODES.length));
    ok(BI.menu.MODES[0].id === 'adventure', '第 1 张卡是闯关打怪');
    ok(BI.menu.MODES[1].id === 'dig', '第 2 张卡是计时拆砖');
    ok(BI.menu.MODES[2].id === 'versus', '第 3 张卡是双人对战');
    ok(M0.step === 'mode' && M0.rows.length === 1 && M0.rows[0].type === 'mode',
       '开始菜单只有模式选择', M0.step + '/' + M0.rows.length);
    ok(M0.modeIndex === 0, '默认选中第 1 张卡', String(M0.modeIndex));

    D.press('ArrowRight');
    ok(D.app.menu.modeIndex === 1 && D.app.menu.step === 'mode', '按 → 切到第 2 张卡', String(D.app.menu.modeIndex));
    D.press('ArrowRight');
    ok(D.app.menu.modeIndex === 2 && D.app.menu.step === 'mode', '再按 → 切到双人模式', String(D.app.menu.modeIndex));
    D.press('ArrowLeft');
    ok(D.app.menu.modeIndex === 1, '按 ← 切回第 2 张卡');

    D.press('Enter');
    ok(D.scene === 'menu' && D.app.menu.step === 'chars', '选完模式后进入角色选择', D.app.menu.step);
    ok(D.app.menu.rows.length === 1 && D.app.menu.rows[0].type === 'char' && D.app.menu.cards.length === 6,
       '角色页显示六张小卡', D.app.menu.rows.length + '/' + D.app.menu.cards.length);
    var beforeChar = D.app.menu.charIndex[0];
    D.press('ArrowRight');
    ok(D.app.menu.charIndex[0] !== beforeChar || D.app.menu.chars.length === 1,
       '按 → 能换 1P 角色', beforeChar + ' -> ' + D.app.menu.charIndex[0]);
    D.press('Escape');
    ok(D.scene === 'menu' && D.app.menu.step === 'mode', '角色页按 Esc 返回模式选择', D.app.menu.step);

    // 从菜单真的能开双人对战：模式 → 1P 确认 → 2P 确认
    D.gotoMenu();
    var mv = D.app.menu;
    mv.modeIndex = 2;
    mv.focus = 0;
    BI.menu.layout(mv);
    D.press('Enter');
    ok(D.scene === 'menu' && mv.step === 'chars' && mv.player === 0,
       '双人模式进入角色页时先选 1P', mv.step + '/' + mv.player);
    ok(mv.tabs.length === 2, '双人角色页有两个玩家标签', String(mv.tabs.length));
    D.press('Digit2');
    ok(mv.player === 1, '数字 2 切到 2P 选角', String(mv.player));
    D.press('Digit1');
    ok(mv.player === 0, '数字 1 切回 1P 选角', String(mv.player));
    D.press('Enter');
    ok(D.scene === 'menu' && mv.step === 'chars' && mv.player === 1,
       '确认 1P 后自动切到 2P', mv.step + '/' + mv.player);
    D.press('Enter');
    ok(D.scene === 'playing' && D.world.mode === 'versus', '确认 2P 后开始对战',
       D.scene + '/' + (D.world && D.world.mode));
    ok(D.world.players.length === 2, '双人模式有 2 个玩家');

    // 选中的角色要真的带进游戏
    D.gotoMenu();
    var mm = D.app.menu;
    mm.modeIndex = 0;
    BI.menu.layout(mm);
    D.press('Enter');
    ok(mm.step === 'chars', '单人模式进入角色页');
    var pick = mm.chars.length - 1;
    BI.menu.setIndex(mm, 0, pick);
    var expectId = mm.chars[pick].id;
    D.press('Enter');
    ok(D.scene === 'playing', '在角色页按 Enter 能开局', D.scene);
    ok(D.world.players[0].assetId === expectId, '菜单选的角色带进了游戏',
       String(expectId) + ' vs ' + String(D.world.players[0].assetId));

    /* ---------- 6. 端到端：拆砖模式胜负 ---------- */
    group('6. 端到端 · 单人计时拆砖');
    D.quickStart('dig', 'DIG01');
    D.tick(0.2);
    ok(bricks() > 0, '开局有软砖', bricks() + ' 块');
    ok(!D.world.match.over, '开局没结束');

    var map = D.world.map;
    for (var i = 0; i < map.length; i++) if (map[i] === 2) map[i] = 0;
    D.tick(0.1);
    ok(D.world.match.over === true, '软砖清空后比赛结束');
    ok(D.world.match.winner === 'p1', '判玩家获胜', String(D.world.match.winner));
    ok(D.world.match.title==='挑战完成', '完成挑战时标题统一', D.world.match.title);

    D.tick(CFG.RESULT_DELAY + 0.3);
    ok(D.scene === 'result', '延迟后自动弹出结算界面', D.scene);

    D.quickStart('dig', 'DIG02');
    D.tick(0.2);
    D.world.match.remaining = 0.05;
    D.tick(0.2);
    ok(D.world.match.over && D.world.match.winner === 'p2', '时间到判负', String(D.world.match.winner));
    ok(D.world.match.title==='时间结束', '计时结束时标题统一', D.world.match.title);

    /* ---------- 7. 端到端：对战模式胜负 ---------- */
    group('7. 端到端 · 双人同屏对战');
    D.quickStart('versus', 'VS01');
    D.tick(0.2);
    ok(D.world.match.scores.p1 === 0 && D.world.match.scores.p2 === 0, '开局 0:0');

    BI.match.onDeath(D.world, D.world.players[0]);
    D.tick(0.1);
    ok(D.world.match.scores.p2 === 1, '1P 阵亡后 2P 得 1 分',
       JSON.stringify(D.world.match.scores));
    ok(D.scene === 'playing', '才 1 分，还在打');
    ok(D.world.match.roundEndsAt > 0, '进入回合间隔');

    D.tick(CFG.ROUND_RESTART_DELAY + 0.3);
    ok(D.world.match.round === 2, '自动进入第 2 回合', String(D.world.match.round));
    ok(D.world.players[0].alive === true, '1P 已重生');

    BI.match.onDeath(D.world, D.world.players[0]);
    D.tick(0.1);
    ok(D.world.match.over === true, '拿到第 2 分后比赛结束');
    ok(D.world.match.winner === 'p2', '2P 获胜', String(D.world.match.winner));
    ok(/2P/.test(D.world.match.title), '标题报出获胜方', D.world.match.title);

    D.tick(CFG.RESULT_DELAY + 0.3);
    ok(D.scene === 'result', '对战结束也弹结算界面', D.scene);

    /* ---------- 8. 端到端：闯关打怪 ---------- */
    group('8. 端到端 · 单人闯关打怪');
    D.quickStart('adventure', 'ADV01');
    D.press('Enter');
    D.tick(0.2);
    ok(D.world.mode === 'adventure', '开的是闯关模式', D.world.mode);
    ok(D.world.match.level === 1, '从第 1 关开始');
    var foeCount = BI.match.countEnemies(D.world);
    ok(foeCount === BI.entities.countFor(1), '敌人数量和关卡对应', foeCount + ' 只');
    ok(D.world.danger !== null, '威胁图已经算出来了');

    var e0 = D.world.enemies[0];
    var ex0 = e0.x, ey0 = e0.y;
    D.tick(1.0);
    ok(e0.x !== ex0 || e0.y !== ey0, '敌人自己会走',
       '(' + ex0.toFixed(1) + ',' + ey0.toFixed(1) + ') -> (' +
       e0.x.toFixed(1) + ',' + e0.y.toFixed(1) + ')');

    D.press('Space');
    ok(D.world.bombs.length === 1, '玩家放下了炸弹');
    D.tick(0.4);
    var hot = 0;
    D.world.enemies.forEach(function (en) {
      if (BI.danger.isHot(D.world, BI.grid.col(en.x), BI.grid.row(en.y))) hot++;
    });
    ok(hot === 0, '放了炸弹之后的 0.4 秒内，没有敌人还站在威胁区里', hot + ' 只还在危险区');

    D.quickStart('adventure', 'ADV02');
    D.press('Enter');
    D.tick(0.2);
    var beforeLevel = D.world.match.level;
    D.world.enemies.length = 0;
    D.tick(0.2);
    ok(D.world.match.levelClearAt > 0, '清场后进入等待', String(D.world.match.levelClearAt));

      D.hold('ArrowUp',.12);D.render(.95);
      var back=BI.assets.ready(visual+'-back');
      ok(back&&backHero.asset===back&&back.img.naturalWidth>500&&back.sprite&&back.flipForLeft===false,
        visual+' 朝上使用清晰独立背面，不做左右镜像');
      D.tick(.1);D.render(.05);ok(backHero.asset===back,visual+' 松开方向后保持背面');
      var stationaryX=backHero.x,stationaryY=backHero.y;back.ok=false;D.render(1);
      ok(backHero.asset.id===visual&&backHero.x===stationaryX&&backHero.y===stationaryY,
        visual+' 背面暂未加载时回退正面，位置和碰撞不变');
      back.ok=true;D.render(1);
      D.hold('ArrowDown',.12);D.render(1);ok(backHero.asset.id===visual,visual+' 向下切回正面');
      D.hold('ArrowLeft',.12);D.render(1);ok(backHero.asset.id===visual&&backHero.facing===-1,visual+' 向左保留原有显示');
      D.hold('ArrowRight',.12);D.render(1);ok(backHero.asset.id===visual&&backHero.facing===1,visual+' 向右保留原有显示');
    });
    D.quickStart('versus','BACK_TWO_PLAYERS');
    var backDuel=D.world;backDuel.map.landmark=null;
    for(var dr=1;dr<12;dr++)for(var dc=1;dc<14;dc++)G.set(backDuel.map,dc,dr,BI.T.EMPTY);
    backDuel.players.forEach(function(p,i){p.x=p.px=G.centerX(5+i*4);p.y=p.py=G.centerY(7);});
    D.hold('KeyW',.12);D.render(1);
    ok(/-back$/.test(backDuel.players[1].asset.id)&&!/-back$/.test(backDuel.players[0].asset.id),'双人2P的W只切换2P背面，不影响1P');
    D.hold('ArrowUp',.12);D.render(1);ok(backDuel.players.every(function(p){return /-back$/.test(p.asset.id);}),
      '双人模式双方可以独立朝上显示背面');

    if(new URLSearchParams(location.search).has('stress')) {
      group('持续运行：全部六角色与普通关 / BOSS关');
      var stressRuns=0,stressSeconds=0,stressBad=[],stressBombs=0;
      BI.assets.selectable().forEach(function(id){[3,5,6,10].forEach(function(level){
        try {
          D.quickStart('adventure','STRESS_'+id+'_'+level);D.startLevel(level);D.press('Enter');
          var aw=D.world,ap=aw.players[0];ap.assetId=id;
          if(level===5||level===10){
            var se=aw.enemies[0];se.hp=level===5?6:3;BI.entities.syncBossPhase(aw,se);
          }
          for(var sec=0;sec<60;sec++) {
            // 十关已通关时另开一场，继续覆盖完整60秒战斗，而不是把胜利当异常。
            if(aw.match.over){
              if(aw.match.winner!=='p1')throw Error('unexpected defeat');
              D.quickStart('adventure','STRESS_REPLAY_'+id+'_'+level+'_'+sec);D.startLevel(level);D.press('Enter');
              aw=D.world;ap=aw.players[0];ap.assetId=id;
              if(level===5||level===10){var replayBoss=aw.enemies[0];replayBoss.hp=level===5?6:3;BI.entities.syncBossPhase(aw,replayBoss);}
            }
            if(aw.briefing)D.press('Enter');
            ap.invuln=120;ap.lives=5;ap.maxBombs=8;ap.power=3;
            // 使用真实空地与正常放弹路径，让不同阵营的炸弹持续形成连锁。
            var targets=aw.enemies.filter(function(e){return e.alive;});
            if(targets.length&&sec%3===0){
              var target=targets[sec%targets.length],tc=G.col(target.x),tr=G.row(target.y);
              if(!BI.rules.bombAt(aw,tc,tr)&&G.at(aw.map,tc,tr)===BI.T.EMPTY){ap.x=ap.px=G.centerX(tc);ap.y=ap.py=G.centerY(tr);}
            }
            if(BI.rules.tryPlaceBomb(aw,ap))stressBombs++;
            if(!ap.skillCd)BI.skills.cast(aw,ap);
            var direction=['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'][sec%4];
            D.hold(direction,1);D.render(sec%2?.05:.95);
            if(!isFinite(ap.x)||!isFinite(ap.y)||D.app.runtimeFault||
              (D.scene!=='playing'&&!(D.scene==='result'&&aw.match.winner==='p1')))throw Error('invalid world');
            stressSeconds++;
          }
          stressRuns++;
        }catch(err){stressBad.push(id+'@'+level+': '+err.message);}
      });});
      ok(stressRuns===24&&stressSeconds===1440&&stressBombs>100&&stressBad.length===0,
        '六角色×四种起始关卡累计运行24分钟逻辑时间，持续投弹/技能/换关无异常',stressBad.join(';'));
      lines.push('STRESS runs='+stressRuns+' seconds='+stressSeconds+' bombs='+stressBombs);
    }

    group('五首配乐的浏览器加载与格式兼容');
    var audioChecks = await Promise.all(Object.keys(MUS.tracks).map(function (id) {
      return new Promise(function (resolve) {
        var audio = new Audio(), timer;
        function finish(valid) {
          clearTimeout(timer);
          audio.onloadedmetadata = audio.onerror = null;
          var detail = audio.error ? 'media error ' + audio.error.code : 'duration=' + audio.duration;
          audio.removeAttribute('src');
          audio.load();
          resolve({ id: id, valid: valid, detail: detail });
        }
        audio.onloadedmetadata = function () {
          finish(isFinite(audio.duration) && audio.duration > 10 && audio.canPlayType('audio/mpeg') !== '');
        };
        audio.onerror = function () { finish(false); };
        timer = setTimeout(function () { finish(false); }, 6000);
        audio.preload = 'auto';
        audio.src = MUS.srcFor(id);
        audio.load();
      });
    }));
    audioChecks.forEach(function (result) {
      ok(result.valid, result.id + ' 配乐文件可加载且格式受支持', result.detail);
    });

    group('CLI 共享内核与浏览器输入一致');
    ['dig', 'adventure', 'versus'].forEach(function (mode) {
      var config = { mode: mode, seed: 'shared-engine-parity',
        inputMode: mode === 'versus' ? 'versus' : 'solo', chars: ['xiaonuo', 'axiu'], label: mode };
      D.startGame(config);
      var visible = D.world, standalone = BI.engine.create(config);
      visible.briefing = standalone.briefing = null;
      var sequence = [
        ['ArrowRight', { hx: 1 }, 12],
        [mode === 'versus' ? 'Enter' : 'Space', { bomb: true }, 1],
        ['ArrowDown', { hy: 1 }, 12],
        [mode === 'versus' ? 'ShiftRight' : 'KeyQ', { skill: true }, 1]
      ];
      sequence.forEach(function (step) {
        D.hold(step[0], step[2] / 60);
        for (var tick = 0; tick < step[2]; tick++) {
          var a = Object.assign({}, step[1]);
          if (tick > 0) { a.bomb = false; a.skill = false; }
          BI.engine.step(standalone, { p1: a }, BI.engine.STEP);
        }
      });
      ok(JSON.stringify(BI.observe(visible, false)) === JSON.stringify(BI.observe(standalone, false)),
        mode + ' 浏览器真实按键与无头动作得到同一局面');
    });

    group('开始菜单右上角：集成 Agent 回放');
    D.gotoMenu();
    var rememberedMenu = D.app.menu, beforeReplay = D.world && D.world.frame;
    var replayButton = BI.menu.REPLAY_BUTTON;
    ok(replayButton.x > CFG.VIEW_W / 2 && replayButton.y < 60 && replayButton.x + replayButton.w <= CFG.VIEW_W,
      '回放入口位于开始菜单右上角，不遮挡模式和角色');
    click(replayButton.x + replayButton.w/2, replayButton.y + replayButton.h/2); D.tick(1/60); unclick();
    var replayDialog = document.getElementById('replay-dialog'), replayFrame = replayDialog && replayDialog.querySelector('iframe');
    ok(D.app.replayOpen && replayDialog.open && /\/replay\.html\?embedded=1$/.test(replayFrame.src),
      '点击入口在游戏内打开回放播放器');
    key('keydown','Enter'); D.tick(.5); key('keyup','Enter');
    ok(D.scene === 'menu' && D.app.menu === rememberedMenu && (!D.world || D.world.frame === beforeReplay),
      '观看时冻结开始菜单，输入不会意外开局');
    window.dispatchEvent(new MessageEvent('message',{source:window,data:{type:'bombit-replay-close'}}));
    ok(replayDialog.open, '其他窗口的消息不会关闭播放器');
    window.dispatchEvent(new MessageEvent('message',{source:replayFrame.contentWindow,data:{type:'bombit-replay-close'}}));
    await new Promise(function(resolve){setTimeout(resolve,30);});
    ok(!D.app.replayOpen && !document.getElementById('replay-dialog') && D.app.menu === rememberedMenu,
      '返回游戏关闭播放器并保留模式与角色选择');
    D.press('Enter',1/60);
    ok(D.app.menu.step === 'chars', '从回放返回后先进入角色选择');
    D.press('Enter',1/60);
    ok(D.scene === 'playing', '从回放返回后仍可正常开始游戏');

    /* ---------- 18. 全程零报错 ---------- */
    group('18. 运行期报错');
    ok(window.__errs.length === 0, '整个测试过程没有任何 JS 报错',
       window.__errs.join(' | '));

  } catch (e) {
    fail++;
    lines.push('FAIL  测试脚本自身抛异常 → ' + (e && e.stack));
  }

  lines.push('');
  lines.push('SUMMARY pass=' + pass + ' fail=' + fail);
  document.getElementById('out').textContent =
    'BI_TEST_BEGIN\n' + lines.join('\n') + '\nBI_TEST_END';
});
</script>
</body>
</html>
