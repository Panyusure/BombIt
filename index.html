<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q版泡泡堂 · BombIt</title>
<link rel="preload" as="image" href="assets/ui/menu-wallpaper.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background:
      radial-gradient(circle at 79% 17%, #ff5533 0 10.5%, transparent 10.7%),
      radial-gradient(circle at 14% 92%, rgba(92,225,242,.14), transparent 38%),
      radial-gradient(rgba(245,235,216,.10) 1px, transparent 1.2px),
      #0c0a10;
    background-size: auto, auto, 18px 18px, auto;
    font-family: "HarmonyOS Sans SC", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    display: block;
    border-radius: 0;
    outline: 2px solid #141019;
    box-shadow: 8px 8px 0 #ff5533, 0 28px 90px rgba(0,0,0,.62);
    image-rendering: auto;
    touch-action: none;
  }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 10; overflow: hidden;
    background:
      radial-gradient(circle at 82% 18%, #ff5533 0 12%, transparent 12.2%),
      radial-gradient(rgba(20,16,25,.10) 1px, transparent 1.2px),
      #f1e4cf;
    background-size: auto, 16px 16px, auto;
    color: #141019;
  }
  #boot::before, #boot::after {
    content: ""; position: absolute; pointer-events: none;
  }
  #boot::before {
    width: 34vw; height: 34vw; min-width: 280px; min-height: 280px;
    border: 2px solid rgba(20,16,25,.18); border-radius: 50%;
    right: 4vw; top: 6vh;
  }
  #boot::after {
    left: 0; right: 0; bottom: 0; height: 6px;
    background: linear-gradient(90deg,#ff5533 0 16.6%,#5ce1f2 16.6% 33.2%,#ffd23f 33.2% 49.8%,#ff5e9e 49.8% 66.4%,#62df88 66.4% 83%,#141019 83% 100%);
  }
  .boot-card {
    position: relative; z-index: 1;
    width: min(468px, 88vw);
    padding: 26px 28px 24px;
    background: #f5ebd8;
    border: 2.5px solid #141019;
    box-shadow: 8px 8px 0 #141019, 14px 14px 0 #ff5533;
  }
  .boot-top { display: flex; align-items: center; gap: 12px; }
  .boot-mark {
    flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; position: relative;
    background:
      radial-gradient(circle at 36% 48%, #fff 0 8%, transparent 9%),
      radial-gradient(circle at 64% 48%, #fff 0 8%, transparent 9%),
      radial-gradient(circle at 33% 34%, #fff 0 5%, transparent 6%),
      #141019;
    box-shadow: 4px 4px 0 #5ce1f2;
  }
  .boot-mark::before {
    content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%;
    right: -8px; top: -10px; background: #ffd23f;
    box-shadow: 0 0 0 5px rgba(255,211,63,.22);
  }
  .boot-mark::after {
    content: ""; position: absolute; width: 20px; height: 5px; border-radius: 4px;
    left: 29px; top: -4px; background: #ff5533; transform: rotate(-35deg); transform-origin: left center;
  }
  .boot-label { font: 7px/1.4 Consolas, "Courier New", monospace; letter-spacing: .16em; color: rgba(20,16,25,.62); flex: 1; }
  .boot-version { font: 7px/1.4 Consolas, monospace; letter-spacing: .12em; color: rgba(20,16,25,.42); }
  .boot-card h1 { margin: 20px 0 0; font-size: 32px; line-height: .96; letter-spacing: -.06em; color: #141019; }
  .boot-card h1 em { display: block; margin-top: 4px; font-style: normal; font-family: Impact, "Arial Black", sans-serif; font-size: 27px; letter-spacing: .02em; color: #ff5533; -webkit-text-stroke: 1px #141019; }
  #boot-status { color: rgba(20,16,25,.62); font: 7.5px/1.6 Consolas, "Courier New", monospace; letter-spacing: .06em; min-height: 20px; margin: 12px 0 14px; }
  #boot-progress { display: block; appearance: none; width: 100%; height: 8px; border: 1.5px solid #141019; border-radius: 0; overflow: hidden; background: rgba(20,16,25,.12); color: #ff5533; }
  #boot-progress::-webkit-progress-bar { background: rgba(20,16,25,.12); }
  #boot-progress::-webkit-progress-value { background: #ff5533; }
  #boot-progress::-moz-progress-bar { background: #ff5533; }
  .boot-count { display: flex; justify-content: space-between; color: rgba(20,16,25,.52); font: 7px Consolas, monospace; letter-spacing: .08em; margin-top: 8px; }
  #boot-retry { margin-top: 18px; padding: 10px 20px; color: #f5ebd8; background: #141019; border: 0; border-radius: 0; font: 700 11px "Microsoft YaHei", sans-serif; letter-spacing: .12em; cursor: pointer; box-shadow: 4px 4px 0 #ff5533; }
  #boot-retry:hover { background: #ff5533; color: #141019; }
  @media (max-width: 560px) {
    .boot-card { padding: 20px 18px; box-shadow: 5px 5px 0 #141019, 9px 9px 0 #ff5533; }
    .boot-card h1 { font-size: 27px; }
    #boot::before { opacity: .45; }
    #game { box-shadow: 4px 4px 0 #ff5533, 0 18px 48px rgba(0,0,0,.55); }
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="boot" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-top">
        <div class="boot-mark" aria-hidden="true"></div>
        <div class="boot-label">BOMBIT / LOADING BAY</div>
        <div class="boot-version">v2.2</div>
      </div>
      <h1>Q版泡泡堂<em>BOMBIT</em></h1>
      <p id="boot-status">正在加载游戏代码…</p>
      <progress id="boot-progress" value="0" max="100" aria-label="游戏加载进度"></progress>
      <div class="boot-count"><span id="boot-detail">准备开始</span><span id="boot-percent">0%</span></div>
      <button id="boot-retry" hidden onclick="location.reload()">重新加载</button>
    </div>
  </div>
  <script>
    (function () {
      var scripts = 0, scriptTotal = 26, resources = 0, resourceTotal = 7, phase = 'menu';
      function show(detail) {
        var bar = document.getElementById('boot-progress'); if (!bar) return;
        var percent = phase === 'game' ? Math.round(resources / resourceTotal * 100) :
          Math.round((scripts + resources) / (scriptTotal + resourceTotal) * 100);
        bar.value = percent;
        document.getElementById('boot-percent').textContent = percent + '%';
        document.getElementById('boot-detail').textContent = detail;
      }
      window.BombItBoot = { resources: function (done, total, nextPhase) {
        if (!document.getElementById('boot')) return;
        resources = done; resourceTotal = total; phase = nextPhase || 'menu';
        document.getElementById('boot-status').textContent = done === total ? '准备就绪' :
          (phase === 'game' ? '正在准备对局画面…' : '正在准备角色与场景…');
        show(done + ' / ' + total + ' 项画面资源');
      } };
      document.addEventListener('load', function (event) {
        if (event.target.tagName !== 'SCRIPT' || !event.target.src) return;
        scriptTotal = document.querySelectorAll('script[src]').length; scripts++;
        show(scripts + ' / ' + scriptTotal + ' 项游戏代码');
      }, true);
      document.addEventListener('error', function (event) {
        if (event.target.tagName !== 'SCRIPT' || !document.getElementById('boot')) return;
        document.getElementById('boot-status').textContent = '游戏代码加载失败，请重试';
        document.getElementById('boot-retry').hidden = false;
      }, true);
    })();
  </script>

  <!-- 传统 script 标签：保证 file:// 双击直接可玩（ES module 会被 CORS 拦截） -->
  <script defer src="assets/characters.js"></script>
  <script defer src="src/core/config.js"></script>
  <script defer src="src/core/rng.js"></script>
  <script defer src="src/core/input.js"></script>
  <script defer src="src/game/grid.js"></script>
  <script defer src="src/game/levelgen.js"></script>
  <script defer src="src/game/motion.js"></script>
  <script defer src="src/game/rules.js"></script>
  <script defer src="src/game/danger.js"></script>
  <script defer src="src/game/entities.js"></script>
  <script defer src="src/game/ai.js"></script>
  <script defer src="src/game/match.js"></script>
  <script defer src="src/game/engine.js"></script>
  <script defer src="src/game/snapshot.js"></script>
  <script defer src="src/game/observation.js"></script>
  <script defer src="src/render/draw.js"></script>
  <script defer src="src/render/assets.js"></script>
  <script defer src="src/render/effects.js"></script>
  <script defer src="src/render/sprites.js"></script>
  <script defer src="src/render/hud.js"></script>
  <script defer src="src/audio/sfx.js"></script>
  <script defer src="src/audio/music.js"></script>
  <script defer src="src/scenes/menu.js"></script>
  <script defer src="src/scenes/pause.js"></script>
  <script defer src="src/scenes/result.js"></script>
  <script defer src="src/main.js"></script>
</body>
</html>
