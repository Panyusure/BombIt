<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q版泡泡堂 · BombIt</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #4a5a8a 0%, #232a44 60%, #161a2c 100%);
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    display: block;
    border-radius: 14px;
    box-shadow: 0 18px 60px rgba(0,0,0,.55), 0 0 0 3px rgba(255,255,255,.09);
    image-rendering: auto;
    touch-action: none;
  }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 10; background: radial-gradient(ellipse at 50% 35%, #304b53, #101e2b 75%);
    color: #eaf1e6; text-align: center;
  }
  .boot-card { width: min(360px, 78vw); }
  .boot-mark { width: 58px; height: 58px; border-radius: 50%; margin: 0 auto 28px;
    background: radial-gradient(circle at 32% 28%, #fff9, transparent 30%), linear-gradient(145deg, #b5ead8, #5ec8f0);
    box-shadow: 0 0 48px #a6e3cf25, inset 0 0 0 2px #ffffff40; }
  .boot-label { font: 11px Consolas, monospace; letter-spacing: 5px; color: #9ccabf; }
  .boot-card h1 { font-size: 28px; margin: 14px 0 10px; letter-spacing: 4px; }
  #boot-status { color: #9fb5bd; font-size: 13px; min-height: 20px; margin: 0 0 25px; }
  #boot-progress { display: block; appearance: none; width: 100%; height: 7px; border: 0; border-radius: 9px; overflow: hidden; background: #ffffff12; color: #b4e4ce; }
  #boot-progress::-webkit-progress-bar { background: #ffffff12; border-radius: 9px; }
  #boot-progress::-webkit-progress-value { background: linear-gradient(90deg, #72bfc2, #b4e4ce); border-radius: 9px; }
  #boot-progress::-moz-progress-bar { background: #b4e4ce; border-radius: 9px; }
  .boot-count { display: flex; justify-content: space-between; color: #829da9; font-size: 11px; margin-top: 12px; }
  #boot-retry { margin-top: 20px; padding: 9px 20px; color: #15352d; background: #b4e4ce; border: 0; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="boot" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-mark" aria-hidden="true"></div><div class="boot-label">BOMBIT · v2.1</div>
      <h1>泡泡准备中</h1><p id="boot-status">正在加载游戏代码…</p>
      <progress id="boot-progress" value="0" max="100" aria-label="游戏加载进度"></progress>
      <div class="boot-count"><span id="boot-detail">准备开始</span><span id="boot-percent">0%</span></div>
      <button id="boot-retry" hidden onclick="location.reload()">重新加载</button>
    </div>
  </div>
  <script>
    (function () {
      var scripts = 0, scriptTotal = 26, resources = 0, resourceTotal = 20;
      function show(detail) {
        var bar = document.getElementById('boot-progress'); if (!bar) return;
        var percent = Math.round((scripts + resources) / (scriptTotal + resourceTotal) * 100);
        bar.value = percent;
        document.getElementById('boot-percent').textContent = percent + '%';
        document.getElementById('boot-detail').textContent = detail;
      }
      window.BombItBoot = { resources: function (done, total) {
        if (!document.getElementById('boot')) return;
        resources = done; resourceTotal = total;
        document.getElementById('boot-status').textContent = done === total ? '准备就绪' : '正在准备角色与场景…';
        show(done + ' / ' + total + ' 项画面资源');
      } };
      document.addEventListener('load', function (event) {
        if (event.target.tagName !== 'SCRIPT' || !event.target.src) return;
        scriptTotal = document.querySelectorAll('script[src]').length; scripts++;
        show(scripts + ' / ' + scriptTotal + ' 项游戏代码');
      }, true);
      document.addEventListener('error', function (event) {
        if (event.target.tagName !== 'SCRIPT' || !document.getElementById('boot')) return;
        document.getElementById('boot-status').textContent = '游戏代码加载失败，请重试';
        document.getElementById('boot-retry').hidden = false;
      }, true);
    })();
  </script>

  <!-- 传统 script 标签：保证 file:// 双击直接可玩（ES module 会被 CORS 拦截） -->
  <script defer src="assets/characters.js"></script>
  <script defer src="src/core/config.js"></script>
  <script defer src="src/core/rng.js"></script>
  <script defer src="src/core/input.js"></script>
  <script defer src="src/game/grid.js"></script>
  <script defer src="src/game/levelgen.js"></script>
  <script defer src="src/game/motion.js"></script>
  <script defer src="src/game/rules.js"></script>
  <script defer src="src/game/danger.js"></script>
  <script defer src="src/game/entities.js"></script>
  <script defer src="src/game/ai.js"></script>
  <script defer src="src/game/match.js"></script>
  <script defer src="src/game/engine.js"></script>
  <script defer src="src/game/snapshot.js"></script>
  <script defer src="src/game/observation.js"></script>
  <script defer src="src/render/draw.js"></script>
  <script defer src="src/render/assets.js"></script>
  <script defer src="src/render/effects.js"></script>
  <script defer src="src/render/sprites.js"></script>
  <script defer src="src/render/hud.js"></script>
  <script defer src="src/audio/sfx.js"></script>
  <script defer src="src/audio/music.js"></script>
  <script defer src="src/scenes/menu.js"></script>
  <script defer src="src/scenes/pause.js"></script>
  <script defer src="src/scenes/result.js"></script>
  <script defer src="src/main.js"></script>
</body>
</html>
